<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirレジCSV取り込み</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles/style.css">
  <link rel="stylesheet" href="/styles/airregi-import.css">
</head>
<body>
  <main class="airregi-import-page">
    <div class="container">
      <div class="airregi-import-header">
        <h1>AirレジCSV取り込み</h1>
        <a class="btn btn-outline btn-sm" href="/">戻る</a>
      </div>

      <div id="importAlert" class="alert hidden"></div>

      <section id="loginRequired" class="card hidden">
        <div class="card-title">ログイン</div>
        <a class="btn btn-primary btn-block" href="/">ログインする</a>
      </section>

      <section id="importForm" class="card hidden">
        <div class="airregi-form-grid">
          <div class="form-group">
            <label for="storeSelect">店舗</label>
            <select id="storeSelect" class="form-control">
              <option value="">読み込み中...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fixedDateInput">日付固定</label>
            <input id="fixedDateInput" class="form-control" type="date">
          </div>
        </div>

        <div class="form-group">
          <label for="csvFileInput">CSVファイル</label>
          <input id="csvFileInput" class="form-control" type="file" accept=".csv,text/csv">
        </div>

        <div id="fileStatus" class="airregi-file-status hidden"></div>

        <div class="airregi-actions">
          <button id="previewButton" class="btn btn-outline" type="button">確認</button>
          <button id="importButton" class="btn btn-primary" type="button">取り込み</button>
        </div>
      </section>

      <section id="resultSection" class="card hidden">
        <div class="card-title">結果</div>
        <div id="resultSummary"></div>
      </section>
    </div>
  </main>

  <script src="/scripts/airregi-import.js"></script>
</body>
</html>

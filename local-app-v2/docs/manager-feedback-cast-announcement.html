<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>店責FB キャスト向け案内</title>
  <style>
    :root {
      --purple: #6c4df6;
      --purple-dark: #3a2aa3;
      --purple-soft: #eee9ff;
      --ink: #1d2433;
      --muted: #657083;
      --line: #d9dded;
      --paper: #ffffff;
      --bg: #f6f7fb;
      --mint: #10b981;
      --pink: #f35b94;
      --yellow: #f7c948;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(108, 77, 246, 0.12), rgba(16, 185, 129, 0.08) 42%, rgba(247, 201, 72, 0.12)),
        var(--bg);
    }

    .canvas {
      width: 1080px;
      height: 1350px;
      padding: 70px 78px 64px;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: var(--paper);
      color: var(--purple-dark);
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(61, 48, 130, 0.12);
    }

    .badge-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--mint);
    }

    h1 {
      margin: 28px 0 14px;
      font-size: 72px;
      line-height: 1.08;
      letter-spacing: 0;
      font-weight: 900;
    }

    .lead {
      width: 660px;
      margin: 0;
      font-size: 31px;
      line-height: 1.55;
      color: var(--muted);
      font-weight: 700;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 34px;
      align-items: start;
      margin-top: 46px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(217, 221, 237, 0.9);
      border-radius: 28px;
      padding: 34px;
      box-shadow: 0 22px 60px rgba(61, 48, 130, 0.12);
    }

    .steps {
      display: grid;
      gap: 22px;
    }

    .step {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 18px;
      align-items: start;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--paper);
    }

    .num {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: var(--purple);
      color: #fff;
      font-size: 30px;
      font-weight: 900;
    }

    .step:nth-child(2) .num { background: var(--pink); }
    .step:nth-child(3) .num { background: var(--mint); }

    .step-title {
      margin: 0 0 8px;
      font-size: 25px;
      line-height: 1.25;
      font-weight: 900;
    }

    .step-text {
      margin: 0;
      font-size: 23px;
      line-height: 1.48;
      color: var(--muted);
      font-weight: 700;
    }

    .notice {
      margin-top: 24px;
      padding: 24px 26px;
      border-radius: 20px;
      background: var(--purple-soft);
      color: var(--purple-dark);
      font-size: 24px;
      line-height: 1.48;
      font-weight: 900;
    }

    .phone {
      width: 330px;
      border-radius: 36px;
      padding: 10px;
      background: #111827;
      box-shadow: 0 28px 74px rgba(25, 28, 60, 0.24);
      transform: rotate(1.2deg);
    }

    .phone img {
      display: block;
      width: 100%;
      border-radius: 27px;
    }

    .small-note {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 21px;
      line-height: 1.45;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="badge"><span class="badge-dot"></span>キャスト向け</div>
    <h1>店責FBが<br>追加されました</h1>
    <p class="lead">店責・副店責の対応について、良かったことも気になったことも送れるようになりました。</p>

    <section class="main">
      <div class="panel">
        <div class="steps">
          <div class="step">
            <div class="num">1</div>
            <div>
              <p class="step-title">「店責FB」タブを開く</p>
              <p class="step-text">キャスト画面の右端に新しいタブが増えています。</p>
            </div>
          </div>
          <div class="step">
            <div class="num">2</div>
            <div>
              <p class="step-title">対象日・対象者・内容を入力</p>
              <p class="step-text">対象者名は、わかる範囲でOKです。</p>
            </div>
          </div>
          <div class="step">
            <div class="num">3</div>
            <div>
              <p class="step-title">匿名扱いで送信</p>
              <p class="step-text">店責や他キャストには、誰が送ったか表示されません。</p>
            </div>
          </div>
        </div>

        <div class="notice">
          確認が必要な場合のみ、上位者側で送信者を確認する運用です。
        </div>
        <p class="small-note">送る内容：助かった対応 / 気になった対応 / 改善してほしいこと</p>
      </div>

      <div class="phone">
        <img src="images/manager_feedback_cast_local.png" alt="店責フィードバック画面">
      </div>
    </section>

  </main>
</body>
</html>
